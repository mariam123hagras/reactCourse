    <script type="text/babel">
      const container = document.querySelector('.js-container');

         return(
             <>
              {/*<p>{name}</p>
              {discount&&(
                <>
                  <del><p>price:{price}$</p></del>
                  <p>discount:{discount}$</p>
                </>
              )}

              {!discount&&<p>price:{price}$</p>}

              */}

             <img src={imageSrc} width="100"/>
             {discount?<del><p>price:{price}$</p></del>: <p>price:{price}$</p>}
              {discount&&<p>discount:{discount}$</p>}
                <button>Add to Cart</button>
            </>
        )

      }
    
         
        
  
      function App(){  
             return(
              <>
                <ProductDetails name="socks" price="30" discount="10" imageSrc="socks.webp"/>
                <ProductDetails name="balls" price="20" imageSrc="balls.webp"/>
                <ProductDetails name="t-shirts" price="70" imageSrc="t-shits.webp"/>

             )

      root.render(<App/>);
