<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
    <style>
      body{
        font-family:Arial;
        margin:0;
        padding:0;
      }
      .send-button{
        background-color:rgb(25,135,84);
        color:white;
        padding:12px 20px;
        margin-left:10px;
        border:none;
        border-radius:10px;
        cursor:pointer;
        font-size:15px;
      }
      .chat-input{
        padding:12px 15px;
        border-radius:10px;
        border-width:1px;
        font-size:15px;
        flex-grow:1;
      
      }
      .chat-input-container{
        display:flex;
        margin-bottom:60px;
       

      }
      .app-container{
        max-width:600px;
        margin:0 auto;
        height:100vh;
        display:flex;
        flex-direction:column;
      }
      .chat-message-user{
        display:flex;
        justify-content:end;
        align-items:start;
      }
      .chat-message-robot{
        display:flex;
        justify-content:start;
        align-items:start;
      }
      .chat-message-text{
        background-color:rgb(238,238,238);
        padding:10px 15px;
        border-radius:10px;
        max-width:300px;
        margin:5px;
      }
      .chat-message-profile{
        width:45px;
        
      }
      .chat-messages-container{
        flex-grow:1;
        margin-top:20px;
        overflow:scroll;
        scrollbar-width:none;
      }
      /*to position chat input at the bottom we give its parrent class name flex , and directin cloumn ,then we give its siblings flex grow 1 to stretch to the remaing space*/
    </style>
  </head>
  <body>
    <div class="js-container"></div>
        
    </script>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>
    <script type="text/babel">
      const container = document.querySelector('.js-container');
      const root=ReactDOM.createRoot(container) 
      function ChatBot({messages,setMessages}){
        //event is an obect that contains information about the event that occurred, such as the type of event, the target element, and any additional data associated with the event.
        const [inputText,setInputText]=React.useState("");
        const [isLoading,setIsLoading]=React.useState(false);
        function saveInputText(event){
        setInputText(event.target.value); 
        }

        

       
            async function sendMessage(){
             if(isLoading || inputText.trim() === ""){
    return;
  }
          setIsLoading(true);
          setInputText("loading...");

          const newMessages=[
              ...messages,
              {
                message:inputText,
                sender:"user",
                id:crypto.randomUUID()
              }
            ] 
           setMessages(newMessages);
              const response = await Chatbot.getResponseAsync(inputText);
              setMessages([
              ...newMessages,
              {
                message:response,
                sender:"robot",
                id:crypto.randomUUID()
              }
            ])
           setInputText("");
           setIsLoading(false);
            }
            
        
      
           
          
          
            
           function keypress(event){
          if(event.key==="Enter"){
            sendMessage();
          }else if(event.key==="Escape"){
            setInputText("");
          }
        }


      
        //  controlled input useing value and onChange props to control the input field,
      
       
   
      
        return(
          <div className="chat-input-container">
            <input 
              placeholder="Send your message to chatbot" 
              size="30" onChange={saveInputText}
              value={inputText} 
              onKeyDown={keypress}
              className="chat-input"
            />
            <button 
            onClick={sendMessage}
            className="send-button"
            >Send</button>
          </div>
        )
     
      } 
      function ChatMessage({message,sender}){
        // const message=props.message;
        // const sender=props.sender;
        // const {message,sender}=props;
        
         /* if(sender==='robot'){
            return(
               <div>
              <img src="robot.webp" width="50"/>
              {message}
             </div>
            )
           
          }*/

         
         
          return(
             <div className={
              sender==='user'
              ?'chat-message-user'
              :'chat-message-robot'
            }>
            {sender==='robot'&& (
              <img src="robot.webp" className="chat-message-profile"/>
            )}
            <div className="chat-message-text">
               {message}
           </div>
           {sender==='user'&&(
            <img src="user.webp" className="chat-message-profile"/>
          )}
          </div>
          )
         
        
      }
    
      function Messages({messages}){
        // useRef automatically save an html element from the component
        // ref is a container with special react features

     const chatMessagesRef= React.useRef(null);

        // useEffect lets us run some code after the component is created or updated
        // hooks doesn't exist inside if statement or inside a function or any thing
        // [] second parameter of useEffect is a dependency array that tells React when to run the effect, if it's empty it runs only once after the initial render, if it has values it runs whenever those values change
        React.useEffect(()=>{
        const containerElem = chatMessagesRef.current;
        // scrollTop is a property that sets or returns the number of pixels an element's content is scrolled vertically, scrollHeight is a property that returns the entire height of an element in pixels, including padding, but not the border, scrollbar, or margins, so by setting scrollTop to scrollHeight we scroll to the bottom of the container evey time messages change or when component is first created
        if(containerElem){
          containerElem.scrollTop = containerElem.scrollHeight;
        }
         
        },[messages])
          return(
            <div className="chat-messages-container"
            ref={chatMessagesRef}>
               {
                messages.map((messageObj)=>{
                      return(
                        <ChatMessage 
                                  message={messageObj.message}
                                  sender={messageObj.sender}
                                  key={messageObj.id}
                          />
                      )
        
                                          }
                              )
              }
            </div>
          )
      

      }
   
      function App(){
        const [messages,setMessages]=React.useState ([{
            message:"hello,ChatBot",
            sender:"user",
            id:"id1"
          },
          {
            message:"hello,how can i help you?",
            sender:"robot",
            id:"id2"
          }
          ])
            
        
        return(
             <div className="app-container">
                {/*ChatBot()*/}
             { /*by useing curly braces we can save any type of value inside a prop
              ,lifting state up : share state between components by passing them as props in a parent component,
              naming conventions is using the same name for component and prop and its value*/}
            
                <Messages messages={messages} />
                    <ChatBot 
                     messages={messages}
                     setMessages={setMessages}/>
               
            </div>
        )
    
      }
     
     
      root.render(<App/>);

    </script>
  </body>
</html>
